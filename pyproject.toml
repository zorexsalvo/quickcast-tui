[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quickcast-tui"
version = "0.1.0"
description = "A radial menu TUI for executing shell scripts (spells) configured via TOML"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "zorexsalvo", email = "zorexsalvo@gmail.com"}
]
keywords = ["tui", "terminal", "menu", "textual"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
]

dependencies = [
    "textual>=0.40.0",
]

[project.urls]
Homepage = "https://github.com/zorexsalvo/quickcast-tui"
Repository = "https://github.com/zorexsalvo/quickcast-tui"
Issues = "https://github.com/zorexsalvo/quickcast-tui/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
quickcast = "quickcast.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quickcast"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"
